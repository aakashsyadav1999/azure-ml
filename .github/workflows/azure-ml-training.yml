name: Azure ML Automated Training Pipeline

# Trigger on push to dev branch
on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - '.github/workflows/**'

# Allow manual trigger
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  
jobs:
  # Job 1: Generate Iris dataset
  prepare-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        uv add -r requirements.txt
    
    - name: Generate Iris training data
      run: |
        mkdir -p data
        uv run python src/generate_data.py --output-dir data --test-size 0.2
    
    - name: Upload data artifact
      uses: actions/upload-artifact@v4
      with:
        name: iris-training-data
        path: data/
        retention-days: 30

  # Job 2: Submit Azure ML training job
  azure-ml-training:
    needs: prepare-data
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Download data artifact
      uses: actions/download-artifact@v4
      with:
        name: iris-training-data
        path: data/
    
    - name: Install core dependencies
      run: |
        uv add -r requirements.txt
    
    - name: Install Azure ML SDK
      run: |
        uv add azureml-core azureml-dataset-runtime azureml-defaults azureml-train-core
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Submit Azure ML Training Job
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        echo "Submitting training job to Azure ML..."
        uv run python src/azure_ml_pipeline.py \
          --config config/azure-ml-config.yml \
          --tenant-id $AZURE_TENANT_ID \
          --service-principal-id $AZURE_CLIENT_ID \
          --service-principal-password $AZURE_CLIENT_SECRET
    
    - name: Wait for job completion (optional)
      if: ${{ github.ref == 'refs/heads/main' }}  # Only wait on main branch
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        echo "Waiting for training completion..."
        python src/azure_ml_pipeline.py \
          --config config/azure-ml-config.yml \
          --tenant-id $AZURE_TENANT_ID \
          --service-principal-id $AZURE_CLIENT_ID \
          --service-principal-password $AZURE_CLIENT_SECRET \
          --wait-for-completion

  # Job 3: Post-training notification
  notify:
    needs: azure-ml-training
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Training Success Notification
      if: ${{ needs.azure-ml-training.result == 'success' }}
      run: |
        echo "✅ Azure ML training job submitted successfully!"
        echo "🔗 Check your Azure ML workspace for job progress"
        echo "📊 Training triggered by commit: ${{ github.sha }}"
    
    - name: Training Failure Notification
      if: ${{ needs.azure-ml-training.result == 'failure' }}
      run: |
        echo "❌ Azure ML training job submission failed!"
        echo "🔍 Please check the workflow logs for details"
        echo "💡 Common issues: Azure credentials, workspace configuration"
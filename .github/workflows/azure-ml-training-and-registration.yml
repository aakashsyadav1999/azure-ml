name: Azure ML Training & Model Registration Pipeline

# Trigger on push to dev branch
on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'data/**'
      - 'config/**'
      - '.github/workflows/**'

# Allow manual trigger
  workflow_dispatch:

# Required permissions for Azure login
permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: '3.9'
  
jobs:
  # Job 1: Generate Iris dataset
  prepare-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Generate Iris training data
      run: |
        mkdir -p data
        python src/generate_data.py --output-dir data --test-size 0.2
        echo "✅ Data generation completed"
        ls -la data/
        echo "📊 Data files ready for training"
        echo "📁 Files to upload:"
        find data/ -name "*.csv" -exec echo "  - {}" \;
    
    - name: Upload data artifact
      uses: actions/upload-artifact@v4
      with:
        name: training-data
        path: data/
        retention-days: 30

  # Job 2: Submit Azure ML training job
  azure-ml-training:
    needs: prepare-data
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download data artifacts
      uses: actions/download-artifact@v4
      with:
        name: training-data
        path: data/
    
    - name: Verify data files
      run: |
        echo "✅ Checking downloaded data files..."
        ls -la data/
        if [ -f "data/train.csv" ] && [ -f "data/test.csv" ]; then
          echo "✅ Both train.csv and test.csv found!"
          echo "📊 Training data rows: $(tail -n +2 data/train.csv | wc -l)"
          echo "📊 Test data rows: $(tail -n +2 data/test.csv | wc -l)"
        else
          echo "❌ Missing data files!"
          exit 1
        fi
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install Azure ML SDK v2
      run: |
        pip install azure-ai-ml azure-identity
        
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
    
    - name: Submit training job to Azure ML
      run: |
        python src/azure_ml_pipeline.py \
          --config config/azure-ml-config.yml \
          --wait-for-completion \
          --register-model \
          --tenant-id ${{ secrets.AZURE_TENANT_ID }} \
          --client-id ${{ secrets.AZURE_CLIENT_ID }} \
          --client-secret ${{ secrets.AZURE_CLIENT_SECRET }}

  # Job 3: Post-training notification
  notify:
    needs: azure-ml-training
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Training Success Notification
      if: ${{ needs.azure-ml-training.result == 'success' }}
      run: |
        echo "✅ Azure ML training and model registration completed successfully!"
        echo "🔗 Check your Azure ML workspace for job progress and registered model"
        echo "📊 Training triggered by commit: ${{ github.sha }}"
        echo "🎯 Model is now registered and ready for deployment"
    
    - name: Training Failure Notification
      if: ${{ needs.azure-ml-training.result == 'failure' }}
      run: |
        echo "❌ Azure ML training job submission failed!"
        echo "🔍 Please check the workflow logs for details"
        echo "💡 Common issues: Azure credentials, workspace configuration"
        echo "💡 Common issues: Azure credentials, workspace configuration"
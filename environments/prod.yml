# Environment-specific configuration for Production
environment: Production
azure_ml:
  experiment_suffix: "-prod"
  compute:
    min_instances: 0
    max_instances: 4
    vm_size: "Standard_DS3_v2"
  
model:
  registration:
    auto_approve: true
    tags:
      environment: "production"
      auto_deploy: true

pipeline:
  settings:
    force_rerun: false
    continue_on_step_failure: false